# Разворачивает базу и функции в Supabase, задаёт секреты и подключает бота к Telegram.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, TELEGRAM_BOT_TOKEN, CRON_SECRET, WEBHOOK_SECRET
# и переменные: SUPABASE_PROJECT_REF, BOT_USERNAME
name: Backend → Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Привязка проекта
        run: supabase link --project-ref "$REF" -p "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Миграции базы
        run: supabase db push --remote --yes -p "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Секреты функций
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          supabase secrets set --project-ref "$REF" --yes \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            CRON_SECRET="${{ secrets.CRON_SECRET }}" \
            WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            BOT_USERNAME="${{ vars.BOT_USERNAME }}" \
            WEBAPP_URL="https://$OWNER.github.io/$REPO/"
      - name: Функции api, bot, cron
        run: supabase functions deploy --project-ref "$REF" --yes
      - name: Вебхук и кнопка меню бота
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          curl -fsS "https://api.telegram.org/bot$TOKEN/setWebhook" \
            -d "url=https://$REF.supabase.co/functions/v1/bot" \
            -d "secret_token=${{ secrets.WEBHOOK_SECRET }}" \
            -d 'allowed_updates=["message","callback_query"]'
          curl -fsS "https://api.telegram.org/bot$TOKEN/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Запись\",\"web_app\":{\"url\":\"https://$OWNER.github.io/$REPO/\"}}}"
